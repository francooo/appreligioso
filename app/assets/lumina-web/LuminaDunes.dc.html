<x-dc>

<div style="position:absolute;left:-30%;bottom:-45%;width:105%;height:95%;border-radius:50%;background:#F2DFCB;opacity:.9"></div>
<div style="position:absolute;left:35%;bottom:-60%;width:100%;height:100%;border-radius:50%;background:#EDD2B9;opacity:.75"></div>
<div style="position:absolute;left:-15%;bottom:-78%;width:85%;height:100%;border-radius:50%;background:#E8C7AB;opacity:.6"></div>
<div style="position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(#FBF5EC, rgba(251,245,236,0))"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:300}}"></script>
</body>
</html>
